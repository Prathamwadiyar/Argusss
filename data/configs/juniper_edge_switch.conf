## Juniper Junos OS EX4400 Aggregation Switch
## Hostname: JUNIPER-EDGE-SW01
version 22.2R1.9;
system {
    host-name JUNIPER-EDGE-SW01;
    root-authentication {
        encrypted-password "$6$kO9s7vL$8dG34yH9x2...";
    }
    services {
        ssh {
            protocol-version v2;
            connection-limit 5;
        }
    }
    login {
        idle-timeout 10;
        password {
            format sha-512;
            minimum-length 12;
        }
    }
    syslog {
        host 10.10.10.20 {
            any informational;
            facility-override local7;
        }
    }
    ntp {
        server 10.0.0.1 prefer;
    }
}
snmp {
    v3 {
        usm {
            local-user secadmin {
                authentication-sha {
                    authentication-password "JunosSecureAuth99#";
                }
                privacy-aes128 {
                    privacy-password "JunosSecurePriv99#";
                }
            }
        }
    }
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                address 10.10.1.1/24;
            }
        }
    }
}
