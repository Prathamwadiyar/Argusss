! Cisco IOS-XE Enterprise Core Router 8300
! Hostname: CORE-RTR-01
version 17.6
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname CORE-RTR-01
!
security passwords min-length 12
enable secret 9 $9$8cKg$n53vJ8N1s2qL3...
!
aaa new-model
aaa authentication login default local
!
ip domain-name enterprise.internal
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
no ip http server
ip http secure-server
!
logging host 192.168.10.50
logging trap informational
!
ntp server 192.168.1.1 prefer
ntp server 192.168.1.2
!
snmp-server group SECURE_CORP v3 priv
snmp-server user secadmin SECURE_CORP v3 auth sha MyAuthSecret123 priv aes 128 MyPrivSecret123
!
interface GigabitEthernet0/0/0
 description UPLINK-TO-WAN
 ip address 10.0.0.1 255.255.255.252
 negotiation auto
!
interface GigabitEthernet0/0/1
 description INTERNAL-LAN-CORE
 ip address 192.168.10.1 255.255.255.0
 negotiation auto
!
line con 0
 exec-timeout 10 0
 stopbits 1
line vty 0 4
 exec-timeout 10 0
 transport input ssh
!
end
