# Fortinet FortiGate-60F Enterprise Firewall
# Hostname: FG-PERIMETER-FW01
config system global
    set hostname "FG-PERIMETER-FW01"
    set admin-timeout 10
    set admin-ssh-port 22
    set admin-ssh-cipher chacha20-poly1305
    set timezone 04
end
config system interface
    edit "mgmt"
        set vdom "root"
        set ip 192.168.1.99 255.255.255.0
        set allowaccess ping https ssh
        set type physical
        set snmp-index 1
    next
end
config system password-policy
    set status enable
    set min-length 12
    set min-lower-case-letter 1
    set min-upper-case-letter 1
    set min-non-alphanumeric 1
    set min-number 1
    set apply-to-admin enable
end
config log syslogd setting
    set status enable
    set server "192.168.10.50"
    set mode udp
    set port 514
    set facility local7
end
config system ntp
    set ntpserver "1.1.1.1" "1.0.0.1"
    set type custom
    set syncinterval 60
    set status enable
end
config system snmp user
    edit "secadmin"
        set status enable
        set security-level auth-priv
        set auth-proto sha
        set auth-pwd "FortiAuthSecret123!"
        set priv-proto aes
        set priv-pwd "FortiPrivSecret123!"
    next
end
