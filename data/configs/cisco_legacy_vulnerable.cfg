! Cisco IOS Legacy Branch Router 2911 (Non-Compliant Baseline)
! Hostname: BRANCH-RTR-LEGACY
version 15.1
no service password-encryption
!
hostname BRANCH-RTR-LEGACY
!
enable password cisco
!
ip http server
no ip domain-lookup
!
snmp-server community public RW
snmp-server community private RW
!
line con 0
 exec-timeout 0 0
 password cisco
 login
line vty 0 4
 exec-timeout 0 0
 password cisco
 login
 transport input telnet
!
end
